name: build

# 纯云端交叉编译：不需要本地 Go 环境，产物同时上传到 Actions Artifacts 和 Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (will be created if missing)"
        required: false
        default: "ci-latest"
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=mod"
        run: |
          set -eux
          go version
          VER="$(git describe --tags --always 2>/dev/null || echo v0.0.1)"
          BIN="qzone-history_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${GOOS}" = "windows" ]; then BIN="${BIN}.exe"; fi
          mkdir -p out dist stage/config
          go build -trimpath -ldflags "-s -w -X qzone-history/version.Version=${VER}" -o "out/${BIN}" ./cmd/main.go
          cp "out/${BIN}" stage/
          cp config/config.yaml stage/config/
          cp README.md stage/ 2>/dev/null || true
          test -x "stage/${BIN}"
          ( cd stage && zip -r "../dist/qzone-history_${{ matrix.goos }}_${{ matrix.goarch }}.zip" . )
          ls -l out dist
          unzip -l "dist/qzone-history_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qzone-history-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload binary (raw, for quick download)
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release assets
    needs: [build, termux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qzone-history-*
          merge-multiple: true
          path: assets

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'ci-latest' }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -eux
          ls -l assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/*.zip --clobber
          else
            ARGS=""
            if [ "$PRE" = "true" ]; then ARGS="--prerelease"; fi
            gh release create "$TAG" assets/*.zip \
              --target "${GITHUB_SHA}" \
              --title "qzone-history $TAG" \
              --notes "Automated build from ${GITHUB_SHA} (run #${GITHUB_RUN_NUMBER})" \
              ${ARGS}
          fi

      - name: Summary
        run: |
          {
            echo "### 构建完成 🎉"
            echo ""
            echo "下载地址：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.tag || 'ci-latest' }}"
            echo ""
            echo "| platform | asset |"
            echo "| --- | --- |"
            for f in assets/*.zip; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  termux:
    name: termux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, goarch: arm64, goarm: "", cc: aarch64-linux-android21-clang }
          - { arch: arm, goarch: arm, goarm: "7", cc: armv7a-linux-androideabi21-clang }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (GOOS=android + NDK clang)
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "1"
          GOFLAGS: "-mod=mod"
          NDKCC: ${{ matrix.cc }}
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)"
          fi
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDKCC}"
          test -x "$CC"
          VER="$(git describe --tags --always 2>/dev/null || echo v0.0.1)"
          mkdir -p out dist stage-t/config
          go build -trimpath -ldflags "-s -w -X qzone-history/version.Version=${VER}" -tags netcgo -o out/qzone-history ./cmd/main.go
          file out/qzone-history
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          cp out/qzone-history stage-t/
          cp config/config.yaml stage-t/config/
          cat > stage-t/install.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          set -eu
          cd "$(dirname "$0")"
          P="${PREFIX:-/data/data/com.termux/files/usr}"
          cp qzone-history "$P/bin/qzone-history"
          chmod 700 "$P/bin/qzone-history"
          if [ ! -e "$P/bin/xdg-open" ]; then
            printf '%s\n' '#!/data/data/com.termux/files/usr/bin/sh' 'exec termux-open "$@" >/dev/null 2>&1' > "$P/bin/xdg-open"
            chmod 700 "$P/bin/xdg-open"
          fi
          mkdir -p "$HOME/qzone-history/config"
          [ -f "$HOME/qzone-history/config/config.yaml" ] || cp config/config.yaml "$HOME/qzone-history/config/"
          echo "installed: $P/bin/qzone-history"
          echo "run: cd ~/qzone-history && qzone-history"
          EOF
          chmod +x stage-t/install.sh stage-t/qzone-history
          ( cd stage-t && zip -r "../dist/qzone-history_termux_${ARCH}.zip" . )
          unzip -l "dist/qzone-history_termux_${ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: qzone-history-termux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
